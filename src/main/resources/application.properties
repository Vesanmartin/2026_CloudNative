spring.application.name=ventas

server.port=8081

# Conexion a MySQL en AWS RDS (instancia ecommerce-1)
spring.datasource.url=jdbc:mysql://ecommerce-1.c9mjwjitwufm.us-east-1.rds.amazonaws.com/ventas_publicador
spring.datasource.username=admin
spring.datasource.password=adminadmin

# Persistencia con JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Mostrar las consultas SQL durante el aprendizaje
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Conexion directa a RabbitMQ en EC2
spring.rabbitmq.host=98.81.174.220
spring.rabbitmq.port=5672
spring.rabbitmq.username=ventas_publicador
spring.rabbitmq.password=adminadmin
spring.rabbitmq.virtual-host=ventas
spring.rabbitmq.connection-timeout=5s

# Confirmaciones de publicacion
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Recursos creados desde el panel web
app.rabbitmq.exchange=ventas.exchange
app.rabbitmq.routing-key=ventas.creada
